apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'maven-publish'

android {
    compileSdk 36
    namespace = "com.passport.photo.ucrop"

    defaultConfig {
        minSdk 23
        targetSdk 36
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions {
        abortOnError false
    }

    resourcePrefix 'ucrop_'

    sourceSets.main {
        jni.srcDirs = []
    }
    buildToolsVersion '36.0.0'
    buildFeatures {
        buildConfig = true // Enable the BuildConfig feature
    }
    kotlin {
        jvmToolchain {17}
    }
    publishing {
        singleVariant("release") {}
    }
    ndkVersion '29.0.13599879 rc2'
}
publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components.release
            }
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:${androidx_appcompat_version}"
    implementation "androidx.exifinterface:exifinterface:${androidx_exifinterface_version}"
    implementation "androidx.transition:transition:${androidx_transition_version}"
    implementation "com.squareup.okhttp3:okhttp:5.1.0"
    implementation "androidx.core:core-ktx:${androidx_core_version}"
}
